name: Deploy tour to GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - 'apps/tour/**'
            - '.github/workflows/deploy.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install, build, and upload Astro site
              uses: withastro/action@v6
              with:
                  path: ./apps/tour
                  node-version: 24
                  package-manager: bun

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
