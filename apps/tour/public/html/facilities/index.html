<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ui</title>
		<link rel="stylesheet" href="/output/main-bundle.es.css" />
	</head>
	<body x-data>
		<section class="grid h-dvh grid-cols-[var(--lnb-width)_1fr] grid-rows-[var(--header-height)_1fr]">
			<aside-lnb class="row-span-2 h-full"></aside-lnb>

			<header-list></header-list>

			<main class="main-container" id="main-container">
				<div class="grid w-[calc(100dvw-80px)] grid-cols-[1fr_320px] gap-5 p-5">
					<div class="flex min-w-xl flex-col gap-3">
						<section class="shadow-1 shadow-1xs space-y-2 rounded-lg bg-white p-5">
							<div class="flex flex-wrap items-center justify-between gap-2">
								<div class="flex flex-wrap items-center gap-2">
									<h3>검색 조건</h3>
									<ui-btn variant="icon" icon-name="rotate-left" icon-cls="size-4 stroke-slate-500"></ui-btn>
								</div>
								<div class="flex items-center gap-2">
									<ui-btn
										variant="ghost"
										size="lg"
										cls="min-w-30"
										icon-name="arrow-up"
										icon-pos="lt"
										icon-cls="size-3 stroke-slate-400"
										txt="엑셀 업로드"
										@click.prevent="$store.data.setView('reg'); window.location = '/tour-destination/reg/'"
									></ui-btn>
									<ui-btn
										variant="primary"
										size="lg"
										cls="min-w-30"
										icon-name="arrow-up"
										icon-pos="lt"
										icon-cls="size-3 stroke-white"
										txt="시설 추가"
										@click.prevent="$store.data.setView('reg'); window.location = '/tour-destination/reg/'"
									></ui-btn>
								</div>
							</div>

							<div class="flex flex-wrap items-center justify-between gap-2">
								<div class="inline-flex items-center gap-2">
									<select class="select min-w-62.5" id="" name="">
										<option value="전체 카테고리">전체 카테고리</option>
										<option value="운영 중">운영 중 (n개)</option>
										<option value="운영 전">운영 전 (n개)</option>
										<option value="운영 종료">운영 종료 (n개)</option>
									</select>
									<select class="select min-w-62.5" id="" name="">
										<option value="전체 카테고리">전체 카테고리</option>
										<option value="운영 중">운영 중 (n개)</option>
										<option value="운영 전">운영 전 (n개)</option>
										<option value="운영 종료">운영 종료 (n개)</option>
									</select>
								</div>
								<div>
									<div
										class="input-search group/input-search relative"
										x-data="{ focused: false, keyword: '' }"
										@focusin="focused = true"
										@focusout="focused = false"
									>
										<input
											class="input-text peer pr-15!"
											x-model="keyword"
											type="text"
											placeholder="위치 검색"
										/>

										<div class="absolute top-1.5 right-2 z-2 bg-white">
											<ui-btn
												x-show="focused"
												x-cloak
												variant="icon"
												icon-name="input-del"
												icon-cls="size-4 stroke-slate-400"
												x-on:click="keyword = ''"
											></ui-btn>
										</div>
									</div>
								</div>
							</div>
						</section>

						<section class="shadow-1 shadow-1xs space-y-4 rounded-lg bg-white p-5">
							<div class="inline-flex items-center gap-2">
								<select class="select min-w-50" id="" name="">
									<option value="">10개씩 보기</option>
								</select>
								<select class="select min-w-35" id="" name="">
									<option value="">최신순</option>
									<option value="">가나다순</option>
								</select>
							</div>

							<div class="table-wrap" role="table" aria-label="운영 현황 테이블">
								<table>
									<colgroup>
										<col style="width: 50px" />
										<col style="width: 60px" />
										<col style="width: *" />
										<col style="width: 140px" />
										<col style="width: 140px" />
										<col style="width: 100px" />
										<col style="width: 120px" />
										<col style="width: 120px" />
									</colgroup>
									<thead>
										<tr>
											<th scope="row">
												<ui-checkbox item-id="all-chk"></ui-checkbox>
											</th>
											<th scope="row">NO.</th>
											<th class="text-left" scope="row">시설명</th>
											<th class="text-left" scope="row">카테고리</th>
											<th class="text-left" scope="row">운영기간</th>
											<th class="text-left" scope="row">공통 링크</th>
											<th class="text-left" scope="row">매칭 위치</th>
											<th class="text-left" scope="row">수정일시</th>
										</tr>
									</thead>
									<tbody>
										<template x-for="(item, idx) in $store.data.items" :key="item.id">
											<tr>
												<td>
													<ui-checkbox :item-id="item.id"></ui-checkbox>
												</td>
												<td>
													<ui-txt size="sm" cls="text-center text-black" :txt="idx + 1"></ui-txt>
												</td>
												<td>
													<ui-txt size="sm" cls="text-left text-black" :txt="item.name.ko"></ui-txt>
												</td>
												<td>
													<div class="flex items-center justify-start gap-1">
														<template x-if="item.category.name.ko">
															<ui-txt
																size="sm"
																cls="text-left text-black"
																:txt="item.category.name.ko"
															></ui-txt>
														</template>
														<template x-if="item.category?.parent">
															<ui-txt
																size="sm"
																cls="text-left text-black"
																:txt="'/ ' + item.category.parent.name.ko"
															></ui-txt>
														</template>
													</div>
												</td>
												<td>
													<template x-if="item.isAlways">
														<p class="text-left">상시 운영</p>
													</template>
													<div class="flex items-center">
														<template x-if="!item.isAlways">
															<text-date :dateTime="item.startAt"></text-date>
														</template>
														~
														<template x-if="!item.isAlways">
															<text-date :dateTime="item.endAt"></text-date>
														</template>
													</div>
												</td>
												<td>
													<template x-if="item.facilityButtons.length === 0">
														<ui-txt size="sm" cls="text-left text-slate-500" txt="미사용"></ui-txt>
													</template>
													<template x-if="item.facilityButtons.length">
														<ui-txt
															size="sm"
															cls="text-cms-4 text-left"
															:txt="'사용 (' + item.facilityButtons.filter(btn => btn.tourDestinationCommonButtonId != null).length + '/' + item.facilityButtons.length + ')'"
														></ui-txt>
													</template>
												</td>
												<td class="text-left">
													<template x-if="item.facilityPoiMappings.length === 0">
														<text-badge variant="primary" txt="매칭 전"></text-badge>
													</template>
													<template
														x-if="item.facilityPoiMappings.length && item.facilityPoiMappings[0].poi.name.ko === ''"
													>
														<text-badge variant="danger" txt="이름 없음"></text-badge>
													</template>
													<template
														x-if="item.facilityPoiMappings.length && item.facilityPoiMappings[0].poi.name.ko !== ''"
													>
														<ui-txt
															size="sm"
															cls="text-danger text-left truncate max-w-25"
															:txt="item.facilityPoiMappings[0].poi.name.ko"
														></ui-txt>
													</template>
												</td>

												<td class="text-left">
													<text-date data-time-view="time" :dateTime="item.updatedAt"></text-date>
												</td>
											</tr>
										</template>
									</tbody>
								</table>
							</div>
						</section>

						<section class="inline-flex items-center justify-center gap-3">
							<ui-btn
								variant="text"
								icon-name="arrow-left"
								icon-pos="lt"
								icon-cls="size-4 stroke-black"
								txt="이전"
							></ui-btn>
							<div class="inline-flex items-center justify-center gap-1.5">
								<strong class="button primary h-7 min-w-7" aria-label="1 page">
									<span class="text-white">1</span>
								</strong>
								<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
									<span class="text-slate-500">2</span>
								</button>
								<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
									<span class="text-slate-500">2</span>
								</button>
								<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
									<span class="text-slate-500">2</span>
								</button>
								<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
									<span class="text-slate-500">2</span>
								</button>
								<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
									<span class="text-slate-500">2</span>
								</button>
								<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
									<span class="text-slate-500">2</span>
								</button>
								<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
									<span class="text-slate-500">2</span>
								</button>
								<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
									<span class="text-slate-500">2</span>
								</button>
								<strong class="button text h-7 min-w-7" aria-label="2 page">
									<span class="text-slate-500">..</span>
								</strong>
								<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
									<span class="text-slate-500">999</span>
								</button>
							</div>
							<ui-btn
								variant="text"
								icon-name="arrow-left"
								icon-pos="rt"
								icon-cls="size-4 rotate-180 stroke-black"
								txt="다음"
							></ui-btn>
						</section>
					</div>

					<section class="shadow-1xs flex flex-col rounded-sm bg-white">
						<header class="flex-none px-5 pt-5">
							<h3>시설 상세</h3>
						</header>

						<div
							class="tab flex-1"
							x-data="{
					get firstThumb() {
						return JSON.stringify($store.data.data?.facilityFiles?.[0]) ?? null
					},
					get firstName() {
						return $store.data.data?.name?.ko ?? ''
					},
					get firstCategory() {
						const current = $store.data.data?.category?.name?.ko ?? ''
						const parent = $store.data.data?.category?.parent?.name?.ko ?? ''

						if (current && parent) return `${current} / ${parent}`
						return current || parent || ''
					},
					get firstPoi() {
						return $store.data.data?.facilityPoiMappings?.[0] ?? null
					},
					get firstPoiNameKo() {
						return this.firstPoi?.poi?.name?.ko ?? ''
					},
					get poiMappingsLength() {
						return $store.data.data?.facilityPoiMappings?.length ?? 0
					}
				}"
						>
							<ul class="tab-list">
								<li class="tab-item group/tab-item">
									<label class="tab-button" for="tab-1">
										<input class="peer sr-only" id="tab-1" type="radio" name="tab-1" checked />
										<span class="text-">시설 정보</span>
									</label>
								</li>
								<li class="tab-item group/tab-item">
									<label class="tab-button" for="tab-2">
										<input class="peer sr-only" id="tab-2" type="radio" name="tab-1" />
										<span class="text-">연계 정보</span>
									</label>
								</li>
							</ul>

							<div
								class="flex max-h-[calc(100dvh-286px)] min-h-0 flex-1 flex-col overflow-x-hidden overflow-y-auto"
							>
								<ul class="flex flex-1 flex-col divide-y divide-slate-200">
									<li class="space-y-2 px-5 py-3">
										<div class="flex items-center justify-between">
											<ui-tit tag="h5" size="md" tit="대상지 공통 버튼"></ui-tit>
											<ui-btn variant="ghost" size="sm" cls="min-w-15" txt="수정"></ui-btn>
										</div>
									</li>
									<li class="space-y-2 px-5 py-3">
										<div class="flex items-center justify-between">
											<ui-tit tag="h5" size="md" tit="시설 단독 버튼"></ui-tit>
											<ui-btn variant="ghost" size="sm" cls="min-w-15" txt="수정"></ui-btn>
										</div>

										<facility-button
											:facilityButtons="JSON.stringify($store?.data?.data?.facilityButtons)"
										></facility-button>
									</li>
									<li class="space-y-2 px-5 py-3">
										<div class="flex items-center justify-between">
											<ui-tit tag="h5" size="md" tit="시설 혼잡도"></ui-tit>
											<ui-btn variant="ghost" size="sm" cls="min-w-15" txt="수정"></ui-btn>
										</div>
									</li>
									<li class="space-y-2 px-5 py-3">
										<div class="flex items-center justify-between">
											<ui-tit tag="h5" size="md" tit="위치 기반 콘텐츠"></ui-tit>
											<ui-btn variant="ghost" size="sm" cls="min-w-15" txt="수정"></ui-btn>
										</div>
									</li>
								</ul>

								<ul class="flex flex-1 flex-col divide-y divide-slate-200">
									<li class="space-y-2 px-5 py-3">
										<div class="flex items-center justify-between">
											<ui-tit tag="h5" size="md" tit="기본 정보"></ui-tit>
											<ui-btn variant="ghost" size="sm" cls="min-w-15" txt="수정"></ui-btn>
										</div>

										<div class="grid grid-cols-[90px_1fr] gap-2.5">
											<thumbnail-upload
												:img="$store.data.data?.facilityFiles?.[0]?.fileUrl ?? ''"
												:facilityFiles="firstThumb"
											></thumbnail-upload>

											<div class="space-y-0.5">
												<ui-tit tag="h4" size="sm" :tit="firstName"></ui-tit>

												<div class="flex items-center justify-start gap-1">
													<ui-txt size="xs" :txt="firstCategory"></ui-txt>
												</div>

												<template x-if="poiMappingsLength === 0">
													<text-badge variant="bg-alert" txt="매칭 전"></text-badge>
												</template>

												<template x-if="poiMappingsLength > 0 && firstPoiNameKo === ''">
													<text-badge variant="danger" txt="이름 없음"></text-badge>
												</template>

												<template x-if="poiMappingsLength > 0 && firstPoiNameKo !== ''">
													<text-badge variant="bg-alert" :txt="firstPoiNameKo"></text-badge>
												</template>
											</div>
										</div>
										<lang-translate
											view="side"
											data-text-hidden="ko"
											:lang="JSON.stringify($store.data.data.name)"
										></lang-translate>
									</li>
									<li class="space-y-2 px-5 py-3">
										<div class="flex items-center justify-between">
											<ui-tit tag="h5" size="md" tit="운영 정보"></ui-tit>
											<ui-btn variant="ghost" size="sm" cls="min-w-15" txt="수정"></ui-btn>
										</div>

										<div class="flex items-center gap-2">
											<ui-txt size="xs" txt="운영 기간"></ui-txt>

											<template x-if="$store.data.data.isAlways">
												<ui-txt size="xs" cls="text-black" txt="상시 운영"></ui-txt>
											</template>
											<div class="flex items-center">
												<template x-if="!$store.data.data.isAlways">
													<text-date class="text-xs" :dateTime="$store.data.data.startAt"></text-date>
												</template>
												~
												<template x-if="!$store.data.data.isAlways">
													<text-date class="text-xs" :dateTime="$store.data.data.endAt"></text-date>
												</template>
											</div>
										</div>

										<div class="flex items-center gap-2">
											<ui-txt size="xs" txt="정기 휴무"></ui-txt>
											<ui-txt size="xs" txt="없음"></ui-txt>
										</div>

										<div class="flex gap-2">
											<ui-txt size="xs" txt="운영 기간"></ui-txt>

											<ui-txt size="xs" txt="없음"></ui-txt>
											<ul>
												<li class="grid grid-cols-[40px_1fr] gap-2">
													<ui-txt size="xs" cls="text-cms-3" txt="월"></ui-txt>
													<div>
														<ui-txt size="xs" cls="text-black" txt="없음"></ui-txt>
														<ui-txt size="xs" cls="text-3e61ff" txt="14:00 ~ 15:00 휴게시간"></ui-txt>
													</div>
												</li>
											</ul>
										</div>
									</li>
									<li class="space-y-2 px-5 py-3">
										<div class="flex items-center justify-between">
											<ui-tit tag="h5" size="md" tit="상세 정보"></ui-tit>
											<ui-btn variant="ghost" size="sm" cls="min-w-15" txt="수정"></ui-btn>
										</div>
										<lang-translate
											view="side"
											:lang="JSON.stringify($store.data.data.description)"
										></lang-translate>
									</li>
								</ul>
							</div>
						</div>

						<footer class="flex-none divide-y divide-slate-200 border-t border-t-slate-200 bg-white">
							<div class="flex items-center gap-2 px-5 py-3">
								<h4 class="text-xs">등록</h4>
								<text-date
									class="text-slate-500"
									data-time-view="time"
									:dateTime="$store.data.data.createdAt"
								></text-date>
							</div>

							<div class="grid grid-cols-[60px_1fr] gap-2 px-5 py-3">
								<ui-btn
									class="rounded-sm border border-slate-200"
									variant="icon"
									size="lg"
									icon-name="trash"
									icon-cls="size-5 stroke-slate-400"
									txt="삭제"
								></ui-btn>
								<ui-btn
									variant="primary"
									size="lg"
									cls="text-lg! font-bold"
									txt="저장"
									@click="console.log(document.querySelector('thumbnail-upload').thumbFilesValue)"
								></ui-btn>
							</div>
						</footer>
					</section>
				</div>
			</main>
		</section>

		<script async type="module" src="/output/wc.es.js"></script>
		<script defer src="/output/store/layout-store.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

		<script defer>
			document.addEventListener('alpine:init', () => {
				if (Alpine.store('data')) return;
				Alpine.store('data', {
					items: [],
					data: {},
					itemsToShow: 10,
					loading: false,
					error: null,
					itemId: '',
					setItemId(id = '') {
						this.itemId = id;
						sessionStorage.setItem('facilities-view-id', id);
					},
					view: sessionStorage.getItem('facilities-view') ?? 'reg',
					setView(view = 'reg') {
						this.view = view;
						sessionStorage.setItem('facilities-view', view);
					},
					async init() {
						this.loading = true;
						try {
							const res = await fetch('http://localhost:5185/facilities');

							const data = await res.json();

							this.items = data.data.items;
							this.data = data.data.items[0];

							console.log(this.data);
						} catch (error) {
							this.error = error.message ?? 'Unknown error';
							console.error('초기 데이터 설정 실패:', error);
						} finally {
							this.loading = false;
						}
					},
				});
			});
		</script>
	</body>
</html>
