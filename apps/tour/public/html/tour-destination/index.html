<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ui</title>
		<link rel="stylesheet" href="/output/main-bundle.es.css" />
	</head>
	<body x-data>
		<section class="grid h-dvh grid-cols-[var(--lnb-width)_1fr] grid-rows-[var(--header-height)_1fr]">
			<aside-lnb class="row-span-2 h-full"></aside-lnb>

			<header-list></header-list>

			<main class="main-container" id="main-container">
				<div class="flex max-w-[calc(100dvw-80px)] min-w-5xl flex-col gap-3 p-5">
					<section class="shadow-1 shadow-1xs space-y-2 rounded-lg bg-white p-5">
						<div class="flex flex-wrap items-center justify-between gap-2">
							<div class="flex flex-wrap items-center gap-2">
								<h3>검색 조건</h3>
								<ui-btn variant="icon" icon-name="rotate-left" icon-cls="size-4 stroke-slate-500"></ui-btn>
							</div>
							<div>
								<ui-btn
									tag="a"
									variant="primary"
									size="lg"
									cls="min-w-30"
									icon-name="arrow-up"
									icon-pos="lt"
									icon-cls="size-3 stroke-white"
									txt="대상지 추가"
									x-bind:link="`/tour-destination/reg/${Date.now()}`"
								></ui-btn>
							</div>
						</div>

						<div class="flex flex-wrap items-center justify-between gap-2">
							<div class="inline-flex items-center gap-2">
								<select class="select min-w-62.5" id="" name="">
									<option value="전체">전체 (n개)</option>
									<option value="운영 중">운영 중 (n개)</option>
									<option value="운영 전">운영 전 (n개)</option>
									<option value="운영 종료">운영 종료 (n개)</option>
								</select>
							</div>
							<div>
								<div
									class="input-search group/input-search relative"
									x-data="{ focused: false, keyword: '' }"
									@focusin="focused = true"
									@focusout="focused = false"
								>
									<input
										class="input-text peer pr-15!"
										x-model="keyword"
										type="text"
										placeholder="대상지명 검색"
									/>

									<div class="absolute top-1.5 right-2 z-2 bg-white">
										<ui-btn
											x-show="focused"
											x-cloak
											variant="icon"
											icon-name="input-del"
											icon-cls="size-4 stroke-slate-400"
											x-on:click="keyword = ''"
										></ui-btn>
									</div>
								</div>
							</div>
						</div>
					</section>

					<section class="shadow-1 shadow-1xs space-y-4 rounded-lg bg-white p-5">
						<div class="inline-flex items-center gap-2">
							<select class="select min-w-50" id="" name="">
								<option value="">10개씩 보기</option>
							</select>
							<select class="select min-w-35" id="" name="">
								<option value="">최신순</option>
								<option value="">가나다순</option>
							</select>
						</div>

						<div class="table-wrap" role="table" aria-label="운영 현황 테이블">
							<table>
								<colgroup>
									<col style="width: 100px" />
									<col style="width: *" />
									<col style="width: 180px" />
									<col style="width: 120px" />
									<col style="width: 140px" />
									<col style="width: 120px" />
									<col style="width: 100px" />
									<col style="width: 100px" />
									<col style="width: 100px" />
									<col style="width: 100px" />
									<col style="width: 100px" />
									<col style="width: 120px" />
								</colgroup>
								<thead>
									<tr>
										<th scope="row">NO.</th>
										<th class="col-span-4 text-left" scope="row">대상지명</th>
										<th class="col-span-4 text-left" scope="row">사용 언어</th>
										<th class="col-span-2 text-left" scope="row">운영상태</th>
										<th class="col-span-3 text-left" scope="row">운영기간</th>
										<th class="col-span-3 text-left" scope="row">운영시간</th>
										<th class="col-span-2" scope="row">AI 추천</th>
										<th class="col-span-2" scope="row">
											시설
											<br />
											혼잡도
										</th>
										<th class="col-span-2" scope="row">
											구역
											<br />
											혼잡도
										</th>
										<th class="col-span-2" scope="row">
											위치기반
											<br />
											콘텐츠
										</th>
										<th class="col-span-2" scope="row">
											사용자
											<br />
											지도
										</th>
										<th class="col-span-3 text-left" scope="row">수정일시</th>
									</tr>
								</thead>
								<tbody>
									<template
										x-for="(item, idx) in $store.data.items.slice(($store.data.page - 1) * $store.data.pageSize, $store.data.page * $store.data.pageSize)"
										:key="item.id"
									>
										<tr
											x-data="{
									get link() {
										return `/tour-destination/detail/${item.id}`
									},
									get operationStatusColor() {
										return item.operationStatus === 'operating' ?'text-cms-3' : item.operationStatus === 'closed' ?'text-error' : 'text-slate-400'
									},
									get operationStatus() {
										return item.operationStatus === 'operating' ?'운영 중' : item.operationStatus === 'closed' ?'운영 종료' : '운영 전'
									},
									get supportedLanguages() {
										if (!item?.supportedLanguages) return '';

										const langOrder = ['ko', 'en', 'zh', 'ja', 'th', 'vi'];
										return langOrder
											.filter((key) => item.supportedLanguages[key])
											.join(', ');
									},

									get supportedLanguageList() {
										if (!item?.supportedLanguages) return '[]';

										const langOrder = ['ko', 'en', 'zh', 'ja', 'th', 'vi'];
										return JSON.stringify(
											langOrder.filter((key) => item.supportedLanguages[key])
										);
									},
									get tourDestinationOperatingSchedules() {
										if (!item.tourDestinationOperatingSchedules || item.tourDestinationOperatingSchedules.length === 0) {
											return '정보 없음';
										}
										return item.tourDestinationOperatingSchedules.length > 1 
											? '요일별 상이' 
											: `${item.tourDestinationOperatingSchedules[0].openingTime} <br /> ~ ${item.tourDestinationOperatingSchedules[0].closingTime}`;
									},
									get useText() {
										return (_v) => _v  ? '사용' : '미사용';
									},
									get useTextColor() {
										return (_v) => _v  ? 'text-cms-3' : '';
									}								
								}"
										>
											<td x-text="idx + 1"></td>
											<td>
												<a class="flex items-center gap-2 text-left" :href="link">
													<p
														class="size-4 rounded-xs"
														:style="`background-color: ${item.colorCode || 'transparent'}`"
													></p>
													<ui-txt
														cls="text-black text-left"
														size="sm"
														x-bind:txt="item?.name?.ko"
													></ui-txt>
												</a>
											</td>
											<td>
												<ui-txt
													cls="text-black text-left"
													size="sm"
													x-bind:txt="supportedLanguages"
												></ui-txt>
											</td>
											<td>
												<ui-txt
													class="text-left text-black"
													x-bind:cls="operationStatusColor"
													size="sm"
													x-bind:txt="operationStatus"
												></ui-txt>
											</td>
											<td>
												<template x-if="item.isAlways">
													<p class="text-left">상시운영</p>
												</template>
												<template x-if="!item.isAlways">
													<div>
														<text-date :dateTime="item.startAt"></text-date>
														<div class="flex">
															~
															<text-date :dateTime="item.endAt"></text-date>
														</div>
													</div>
												</template>
											</td>
											<td>
												<ui-txt
													cls="text-left text-black"
													size="sm"
													x-bind:txt="tourDestinationOperatingSchedules"
												></ui-txt>
											</td>
											<td>
												<ui-txt
													x-bind:cls="useTextColor(item.isAiRecommendYn)"
													size="sm"
													x-bind:txt="useText(item.isAiRecommendYn)"
												></ui-txt>
											</td>
											<td>
												<ui-txt
													x-bind:cls="useTextColor(item.isFacilityCongestionYn)"
													size="sm"
													x-bind:txt="useText(item.isFacilityCongestionYn)"
												></ui-txt>
											</td>
											<td>
												<ui-txt
													x-bind:cls="useTextColor(item.isSectionCongestionYn)"
													size="sm"
													x-bind:txt="useText(item.isSectionCongestionYn)"
												></ui-txt>
											</td>
											<td>
												<ui-txt
													x-bind:cls="useTextColor(item.isFacilityAddressYn)"
													size="sm"
													x-bind:txt="useText(item.isFacilityAddressYn)"
												></ui-txt>
											</td>
											<td>
												<a
													class="underline-offset-2 hover:underline"
													:href="item.mapUrl"
													target="_blank"
													rel="noopener noreferrer"
												>
													<span>🔗 이동</span>
												</a>
											</td>

											<td class="col-span-3 text-left">
												<text-date data-time-view="time" :dateTime="item.lastUpdatedAt"></text-date>
											</td>
										</tr>
									</template>
								</tbody>
							</table>
						</div>
					</section>

					<div>
						<paging-table
							x-bind:data-page="$store.data.page"
							x-bind:data-page-size="$store.data.pageSize"
							x-bind:data-total-count="$store.data.totalCount"
							x-bind:data-total-pages="$store.data.totalPages"
							@btn-prev="console.log('prev', $event.detail); $store.data.prevView($event.detail)"
							@btn-next="console.log('next', $event.detail); $store.data.nextView($event.detail)"
							@btn-current="console.log('current', $event.detail); $store.data.currentView($event.detail.page)"
						></paging-table>
					</div>
				</div>
			</main>
		</section>

		<script async type="module" src="/output/wc.es.js"></script>
		<script defer src="/output/store/layout-store.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

		<script defer>
			document.addEventListener('alpine:init', () => {
				if (Alpine.store('data')) return;
				Alpine.store('data', {
					items: [],
					page: 1,
					pageSize: 10,
					totalCount: 1,
					totalPages: 1,
					loading: false,
					error: null,
					itemId: '',
					async fetchData(page) {
						this.loading = true;
						try {
							const res = await fetch(`http://localhost:5195/tour-destinations`);

							if (!res.ok) {
								const text = await res.text();
								throw new Error(`Failed to load json: ${res.status} ${text}`);
							}

							const data = await res.json();
							const payload = data.data ?? {};

							this.items = payload.items ?? [];
							this.page = payload.page;
							this.pageSize = payload.pageSize;
							this.totalCount = payload.totalCount;
							this.totalPages = payload.totalPages;
						} catch (error) {
							this.error = error.message;
							console.error('데이터 로드 실패:', error);
						} finally {
							this.loading = false;
						}
					},
					prevView(detail) {
						const nextPage = Math.max(1, Number(detail.page) - 8);
						this.page = nextPage;
					},
					nextView(detail) {
						const nextPage = Math.min(Math.max(1, Number(detail.totalPages) || 1), Number(detail.page) + 8);
						this.page = nextPage;
					},
					currentView(page) {
						const nextPage = Math.max(1, Number(page) || 1);
						this.page = nextPage;
					},
					async init() {
						await this.fetchData(1);
					},
				});
			});
		</script>
	</body>
</html>
