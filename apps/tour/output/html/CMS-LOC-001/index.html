<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ui</title>
		<link rel="stylesheet" href="/output/main-bundle.es.css" />
	</head>
	<body x-data>
		<section class="grid h-dvh grid-cols-[var(--lnb-width)_1fr] grid-rows-[var(--header-height)_1fr]">
			<aside-lnb class="row-span-2 h-full" authority="administrator"></aside-lnb>
			<!-- authority : D - user || administrator -->

			<header-list></header-list>

			<main class="main-container" id="main-container">
				<div class="flex max-w-[calc(100dvw-80px)] min-w-5xl flex-col gap-3 p-5">
					<section class="shadow-1 shadow-1xs space-y-2 rounded-lg bg-white p-5">
						<div class="flex flex-wrap items-center justify-between gap-2">
							<div class="flex flex-wrap items-center gap-2">
								<h3>검색 조건</h3>
								<ui-btn variant="icon" icon-name="rotate-left" icon-cls="size-4 stroke-slate-500"></ui-btn>
							</div>
							<div>
								<ui-btn
									variant="primary"
									size="lg"
									cls="min-w-30"
									icon-name="arrow-up"
									icon-pos="lt"
									icon-cls="size-3 stroke-white"
									txt="대상지 추가"
									@click.prevent="$store.list.setView('reg'); window.location = './view/'"
								></ui-btn>
							</div>
						</div>

						<div class="flex flex-wrap items-center justify-between gap-2">
							<div class="inline-flex items-center gap-2">
								<select class="select min-w-62.5" id="" name="">
									<option value="전체">전체 (n개)</option>
									<option value="운영 중">운영 중 (n개)</option>
									<option value="운영 전">운영 전 (n개)</option>
									<option value="운영 종료">운영 종료 (n개)</option>
								</select>
							</div>
							<div>
								<div
									class="input-search group/input-search relative"
									x-data="{ focused: false, keyword: '' }"
									@focusin="focused = true"
									@focusout="focused = false"
								>
									<input
										class="input-text peer pr-15!"
										x-model="keyword"
										type="text"
										placeholder="대상지명 검색"
									/>

									<div class="absolute top-1.5 right-2 z-2 bg-white">
										<ui-btn
											x-show="focused"
											x-cloak
											variant="icon"
											icon-name="input-del"
											icon-cls="size-4 stroke-slate-400"
											x-on:click="keyword = ''"
										></ui-btn>
									</div>
								</div>
							</div>
						</div>
					</section>

					<section class="shadow-1 shadow-1xs space-y-4 rounded-lg bg-white p-5">
						<div class="inline-flex items-center gap-2">
							<select class="select min-w-50" id="" name="">
								<option value="">10개씩 보기</option>
							</select>
							<select class="select min-w-35" id="" name="">
								<option value="">최신순</option>
								<option value="">가나다순</option>
							</select>
						</div>

						<div class="table-wrap" role="table" aria-label="운영 현황 테이블">
							<table>
								<colgroup>
									<col style="width: 100px" />
									<col style="width: *" />
									<col style="width: 180px" />
									<col style="width: 120px" />
									<col style="width: 120px" />
									<col style="width: 120px" />
									<col style="width: 100px" />
									<col style="width: 100px" />
									<col style="width: 100px" />
									<col style="width: 100px" />
									<col style="width: 100px" />
									<col style="width: 120px" />
								</colgroup>
								<thead>
									<tr>
										<th scope="row">NO.</th>
										<th class="col-span-4 text-left" scope="row">대상지명</th>
										<th class="col-span-4 text-left" scope="row">사용 언어</th>
										<th class="col-span-2 text-left" scope="row">운영상태</th>
										<th class="col-span-3 text-left" scope="row">운영기간</th>
										<th class="col-span-3 text-left" scope="row">운영시간</th>
										<th class="col-span-2" scope="row">AI 추천</th>
										<th class="col-span-2" scope="row">
											시설
											<br />
											혼잡도
										</th>
										<th class="col-span-2" scope="row">
											구역
											<br />
											혼잡도
										</th>
										<th class="col-span-2" scope="row">
											위치기반
											<br />
											콘텐츠
										</th>
										<th class="col-span-2" scope="row">
											사용자
											<br />
											지도
										</th>
										<th class="col-span-3 text-left" scope="row">수정일시</th>
									</tr>
								</thead>
								<tbody>
									<template x-for="(item, idx) in $store.list.data" :key="item.id">
										<tr>
											<td>99</td>
											<td>
												<a
													class="flex items-center gap-2 text-left"
													@click.prevent="
														$store.list.setView('detail');
														$store.list.setItemId(`${item.id}`);
														window.location.href = './view/';
													"
												>
													<p
														class="size-4 rounded-xs"
														:style="`background-color: ${item.custom.color || 'transparent'}`"
													></p>
													<p x-html="item.name.ko.value"></p>
												</a>
											</td>
											<td>
												<div class="text-left">
													<p
														x-html="Object.keys(item.language).filter((key) => item.language[key]).join(', ')"
													></p>
												</div>
											</td>
											<td>
												<div class="text-left">
													<p
														:class="item.status.trim() === '운영중' ?'text-cms-3' : item.status.trim() === '운영종료' ?'text-error' : 'text-slate-400'"
														x-html="item.status"
													></p>
												</div>
											</td>
											<td>
												<div class="text-left whitespace-pre-line">
													<p
														x-html="item.period.status === 'always' ? '상시 운영' : item.period.day"
													></p>
												</div>
											</td>
											<td>
												<div class="text-left">
													<p
														x-html="item.operatingHours.cols.length > 1 ? '요일별 상이' : `${item.operatingHours.cols[0].time.timeStart} ~ ${item.operatingHours.cols[0].time.timeEnd}`"
													></p>
												</div>
											</td>
											<td
												:class="item.custom.features.ai ? 'text-cms-3': ''"
												x-text="item.custom.features.ai ? '사용' : '미사용'"
											></td>
											<td
												:class="item.custom.features.facility ? 'text-cms-3': ''"
												x-text="item.custom.features.facility ? '사용' : '미사용'"
											></td>
											<td
												:class="item.custom.features.zone ? 'text-cms-3': ''"
												x-text="item.custom.features.zone ? '사용' : '미사용'"
											></td>
											<td
												:class="item.custom.information.location ? 'text-cms-3': ''"
												x-text="item.custom.information.location ? '사용' : '미사용'"
											></td>

											<td>
												<a
													class="underline underline-offset-1"
													:href="item.linkMap"
													target="_blank"
													rel="noopener noreferrer"
												>
													<span>🔗 이동</span>
												</a>
											</td>

											<td class="col-span-3 text-left" x-text="item.editTime"></td>
										</tr>
									</template>
								</tbody>
							</table>
						</div>
					</section>

					<section class="inline-flex items-center justify-center gap-3">
						<ui-btn
							variant="text"
							icon-name="arrow-left"
							icon-pos="lt"
							icon-cls="size-4 stroke-black"
							txt="이전"
						></ui-btn>
						<div class="inline-flex items-center justify-center gap-1.5">
							<strong class="button primary h-7 min-w-7" aria-label="1 page">
								<span class="text-white">1</span>
							</strong>
							<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
								<span class="text-slate-500">2</span>
							</button>
							<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
								<span class="text-slate-500">2</span>
							</button>
							<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
								<span class="text-slate-500">2</span>
							</button>
							<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
								<span class="text-slate-500">2</span>
							</button>
							<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
								<span class="text-slate-500">2</span>
							</button>
							<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
								<span class="text-slate-500">2</span>
							</button>
							<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
								<span class="text-slate-500">2</span>
							</button>
							<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
								<span class="text-slate-500">2</span>
							</button>
							<strong class="button text h-7 min-w-7" aria-label="2 page">
								<span class="text-slate-500">..</span>
							</strong>
							<button class="button text h-7 min-w-7" type="button" aria-label="2 page">
								<span class="text-slate-500">999</span>
							</button>
						</div>
						<ui-btn
							variant="text"
							icon-name="arrow-left"
							icon-pos="rt"
							icon-cls="size-4 rotate-180 stroke-black"
							txt="다음"
						></ui-btn>
					</section>
				</div>
			</main>
		</section>

		<alert-popup class="fixed top-0 left-0" txt="" confirm="확인" cancel="취소" open="close"></alert-popup>

		<script async type="module" src="/output/wc.es.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

		<script defer>
			document.addEventListener('alpine:init', () => {
				const listStore = Alpine.store('list');
				Alpine.store('list', {
					data: [],
					itemsToShow: 10,
					loading: false,
					error: null,
					itemId: '',
					setItemId(id = '') {
						this.itemId = id;
						sessionStorage.setItem('cms-loc-page-view-id', id);
					},
					view: sessionStorage.getItem('cms-loc-page-view') ?? 'reg',
					setView(view = 'reg') {
						this.view = view;
						sessionStorage.setItem('cms-loc-page-view', view);
					},
					async init() {
						this.loading = true;
						this.error = null;

						try {
							const res = await fetch('http://localhost:5185/CMS-LOC-001');

							if (!res.ok) {
								throw new Error('Failed to load json');
							}

							const data = await res.json();

							if (!data || data.length === 0) {
								throw new Error('Not found');
							}

							this.data = data;
						} catch (error) {
							this.error = error.message ?? 'Unknown error';
							console.error('초기 데이터 설정 실패:', error);
						} finally {
							this.loading = false;
						}
					},
				});
			});

			document.addEventListener('DOMContentLoaded', async () => {
				const listStore = Alpine.store('list');
				const pageId = 'CMS_01_1';

				try {
					if (listStore) {
						listStore.init();
					}
				} catch (error) {
					console.error('초기 데이터 설정 실패:', error);
				}
			});
		</script>
	</body>
</html>
