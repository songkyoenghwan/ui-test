<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ui</title>
		<link rel="stylesheet" href="/output/main-bundle.es.css" />
	</head>
	<body x-data>
		<section class="grid h-dvh grid-cols-[var(--lnb-width)_1fr] grid-rows-[var(--header-height)_1fr]">
			<aside-lnb class="row-span-2 h-full" authority="administrator"></aside-lnb>
			<!-- authority : D - user || administrator -->

			<header-list></header-list>

			<main class="main-container" id="main-container">
				<top-tooltip class="absolute top-5 left-5 z-5" tit="지도를 우클릭하여 위치 변경"></top-tooltip>

				<div class="grid grid-cols-[1fr_20rem]">
					<section class="grid size-full" id="map_div"></section>

					<section class="map-list">
						<header class="grid grid-cols-2 gap-x-2 gap-y-3 border-b border-b-slate-200 p-5">
							<ui-tit size="lg" tit="위치 목록"></ui-tit>
							<div class="flex items-center justify-end gap-0.5">
								<ui-txt size="sm" cls="font-bold text-slate-500" txt="302"></ui-txt>
								<ui-txt size="sm" txt="개"></ui-txt>
							</div>
							<select class="select" id="" name="" title="">
								<option value="">전체 카테고리</option>
								<option value="">옵션</option>
							</select>
							<select class="select" id="" name="">
								<option value="">노출 + 비노출</option>
								<option value="">옵션</option>
							</select>
							<input-search-del class="col-span-2" placeholder="위치 검색"></input-search-del>
						</header>

						<div class="flex items-center justify-between gap-1 px-5 py-3">
							<select class="select w-30" id="" name="">
								<option value="">최신순</option>
								<option value="">가나다순</option>
							</select>
							<p class="flex items-center gap-1">
								<ui-txt size="sm" txt="검색결과"></ui-txt>
								<template x-if="$store.list">
									<ui-txt
										size="sm"
										cls="text-cms-3 font-bold"
										:txt="$store?.list.data.totalCount ?? 0"
									></ui-txt>
								</template>
							</p>
						</div>

						<div class="flex min-h-0 flex-1 flex-col">
							<template x-if="$store?.list?.items.length === 0">
								<div class="flex flex-1 flex-col items-center justify-center gap-3 p-5">
									<icon-items
										class="icon stroke-primary fill-primary size-6.5"
										data-name="mouse-circle"
									></icon-items>
									<p class="text-xl text-slate-400">
										지도를 우클릭하면
										<br />
										새 위치가 생성됩니다
									</p>
								</div>
							</template>
							<ul class="flex flex-1 flex-col overflow-x-clip overflow-y-auto scroll-smooth">
								<template x-for="(item, idx) in $store.data.items" :key="item.id">
									<li class="w-full border-b border-b-slate-200" :data-index="idx">
										<button
											class="grid w-full grid-cols-[1fr_minmax(0,40px)] grid-rows-2 gap-x-2 bg-white px-6 py-4 text-left text-sm transition-colors hover:bg-slate-50"
											type="button"
											aria-label="{item.name.ko}"
										>
											<span class="order-1 row-span-1 truncate" x-text="item.name.ko ?? ''"></span>
											<span
												class="order-3 row-span-1 flex items-center gap-2 divide-x divide-slate-200 font-normal"
											>
												<span class="pr-2 text-black empty:hidden" x-text="'POI' + item?.id ?? ''"></span>
												<span class="flex items-center gap-1 text-slate-500">
													등록시설
													<strong class="flex items-center">
														<span
															:class="item.facilityPoiMappings.length === 0 ? 'text-error' : 'text-cms-3'"
															x-text="item.facilityPoiMappings.length"
														></span>

														<span class="font-normal">개</span>
													</strong>
												</span>
											</span>

											<strong class="order-2 row-span-2 grid place-items-center">
												{#if item.isOperationInfoSynced}
												<span class="bg-cms-4 rounded-sm px-2 py-0.5 text-xs font-bold text-white">
													비노출
												</span>
												{/if}
											</strong>
										</button>
									</li>
								</template>
							</ul>
						</div>
					</section>
				</div>
			</main>
		</section>

		<alert-popup class="fixed top-0 left-0" txt="" confirm="확인" cancel="취소" open="close"></alert-popup>

		<script async type="module" src="/output/wc.es.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

		<script defer>
			document.addEventListener('alpine:init', () => {
				const listStore = Alpine.store('list');
				Alpine.store('data', {
					data: {},
					items: [],
					totalCount: 0,
					itemsToShow: 10,
					loading: false,
					error: null,
					itemId: '',
					setItemId(id = '') {
						this.itemId = id;
						sessionStorage.setItem('cms-loc-page-view-id', id);
					},
					view: sessionStorage.getItem('cms-loc-page-view') ?? 'reg',
					setView(view = 'reg') {
						this.view = view;
						sessionStorage.setItem('cms-loc-page-view', view);
					},
					async init() {
						this.loading = true;
						this.error = null;

						try {
							const res = await fetch('http://localhost:5185/facilities');

							if (!res.ok) {
								throw new Error('Failed to load json');
							}

							const data = await res.json();

							console.dir(data);

							if (!data || data.length === 0) {
								throw new Error('Not found');
							}

							this.data = data;
							this.items = this.data?.items ?? [];

							console.log(this.items);
						} catch (error) {
							this.error = error.message ?? 'Unknown error';
							console.error('초기 데이터 설정 실패:', error);
						} finally {
							this.loading = false;
						}
					},
				});
			});

			document.addEventListener('DOMContentLoaded', async () => {
				const listStore = Alpine.store('data');

				try {
					if (listStore) {
						listStore.init();
					}
				} catch (error) {
					console.error('초기 데이터 설정 실패:', error);
				}
			});
		</script>
	</body>
</html>
