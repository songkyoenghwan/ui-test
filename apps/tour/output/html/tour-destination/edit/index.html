<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ui</title>
		<link rel="stylesheet" href="/output/main-bundle.es.css" />
	</head>
	<body x-data>
		<section class="grid h-dvh grid-cols-[var(--lnb-width)_1fr] grid-rows-[var(--header-height)_1fr]">
			<aside-lnb class="row-span-2 h-full" authority="administrator"></aside-lnb>
			<!-- authority : D - user || administrator -->

			<header-list></header-list>

			<main class="main-container" id="main-container">
				<div class="sticky top-0 z-5 grid w-full min-w-5xl bg-slate-50 pb-5">
					<section class="w-full space-y-2 bg-slate-50 p-5 transition-all">
						<div class="flex items-center justify-between">
							<div>
								<template x-if="$store.data.view === 'reg'">
									<ui-tit tag="h2" size="lg" tit="대상지 등록"></ui-tit>
								</template>

								<template x-if="$store.data.view === 'edit'">
									<ui-tit tag="h2" size="lg" tit="대상지 수정"></ui-tit>
								</template>

								<template x-if="$store.data.view === 'detail'">
									<ui-tit tag="h2" size="lg" :tit="$store.data.data?.name?.ko ?? ''"></ui-tit>
								</template>
							</div>

							<div class="flex items-center gap-3">
								<template x-if="$store.data.view === 'detail'">
									<div class="flex gap-3">
										<ui-btn class="w-20" variant="ghost" size="lg" txt="목록"></ui-btn>

										<ui-btn class="w-20" variant="ghost" size="lg" txt="삭제"></ui-btn>

										<ui-btn
											class="w-20"
											tag="a"
											variant="primary"
											size="lg"
											txt="수정"
											link="/tour-destination/edit/1"
										></ui-btn>
									</div>
								</template>
							</div>

							<template x-if="$store.data.view === 'edit' || $store.data.view === 'reg'">
								<ui-btn
									class="w-20"
									variant="primary"
									size="lg"
									txt="저장"
									@click="console.log(document.querySelector('operating-period').isAlways)"
								></ui-btn>
							</template>
						</div>
					</section>

						<div class="flex items-center">
			<ui-tit class="px-4.5" tit="섹션"></ui-tit>

			<div class="flex items-center gap-3">
				<ui-btn
					class="w-60 gap-3"
					tag="label"
					variant="segmented"
					size="lg"
					name="tab-section"
					:arr="JSON.stringify([{ name: '대상지 정보', txt: '대상지 정보' }, { name: '커스텀 항목', txt: '커스텀 항목' }])"
					scroll="tab-section"></ui-btn>
			</div>
		</div>

				</div>

				<article class="space-y-5 px-5 pb-5">
					<section class="shadow-1xs space-y-3 rounded-lg bg-white p-5 text-sm" id="target-scroll-tab-section-0">
						<ui-tit tag="h3" size="lg" tit="대상지 정보"></ui-tit>

						<ul
				class="divide-y divide-slate-300"
				x-data="{
						get supportedLanguages() {
							return JSON.stringify(
								$store.data.data?.supportedLanguages ?? {
									ko: true,
									en: true,
									ja: false,
									th: false,
									vi: false,
									zh: false,
								}
							)
						},
						// get firstName() {
						// 	return JSON.stringify($store.data.data?.name) ?? '{}'
						// },
						get tourDestinationOperatingSchedules() {
							return JSON.stringify($store.data.data?.tourDestinationOperatingSchedules) ?? '{}'
						},
						get firstPoiNameKo() {
							return this.firstPoi?.poi?.name?.ko ?? ''
						},
						get poiMappingsLength() {
							return $store.data.data?.facilityPoiMappings?.length ?? 0
						},
						get operationGuide() {
							return JSON.stringify($store.data.data?.operationGuide ?? {})
						}
						
					}"
			>
							<li>
								<div
									class="grid max-w-375 grid-cols-[240px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
								>
									<ui-tit
										tit="제공 언어"
										:sub="$store.data.view !== 'detail' ? '사용자에게 제공할 언어를 선택해 주세요' : ''"
									></ui-tit>
									<lang-chk
										class="flex flex-wrap items-center gap-5"
										:class="$store.data.view !== 'detail' ? 'justify-end' : ''"
										:view="$store.data.view"
										:lang="supportedLanguages"
									></lang-chk>
								</div>
							</li>
							<li>
								<div
									class="grid max-w-375 grid-cols-[100px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
								>
									<ui-tit
										tit="대상지명"
										:tip="$store.data.view !== 'detail'? '15자 이내 권장' : ''"
										tooltip="언어에 따라 표현 길이가 달라질 수 <br />있으므로 번역 내용을 확인해주세요. (최대 50자)"
									></ui-tit>
									<lang-translate
										data-max-length="50"
										:view="$store.data.view"
										@translate="$store.data.t($event.detail.lang)"
									></lang-translate>
								</div>
							</li>

							<li>
								<div
									class="grid max-w-375 grid-cols-[100px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
								>
									<ui-tit tit="위치" cls="h-full items-center"></ui-tit>
									<div class="flex flex-wrap items-center gap-5">
										<ui-txt size="sm" txt="지도의 중심 좌표를 선택해 주세요"></ui-txt>
										<ui-btn class="min-w-30" variant="ghost" size="md" txt="지도에서 선택하기"></ui-btn>
										<ui-txt
											size="sm"
											txt="서울특별시 용산구 이태원로 29 (한강로1가)"
											cls="text-black"
										></ui-txt>
									</div>
								</div>
							</li>

							<li>
								<div class="grid max-w-375 grid-cols-2 gap-5 divide-x divide-slate-200 px-4 py-5">
									<div class="group grid grid-cols-[100px_1fr] gap-5 has-[[view=detail]]:grid-cols-[122px_1fr]">
										<ui-tit
											class="group-not-[[view=detail]]:pt-1 group-has-[[view=detail]]:place-content-center"
											tit="운영 기간"
										></ui-tit>
										<operating-period
											:view="$store.data.view"
											:is-always="$store.data.view !== 'reg' ? $store.data.data?.isAlways : true"
											:start-at="$store.data.data?.startAt"
											:end-at="$store.data.data?.endAt"
										></operating-period>
									</div>

									<div class="group grid grid-cols-[100px_1fr] gap-5 has-[[view=detail]]:grid-cols-[122px_1fr]">
										<ui-tit
											class="group-not-[[view=detail]]:pt-1 group-has-[[view=detail]]:place-content-center"
											tit="정기 휴무"
										></ui-tit>
										<closing-day
											:view="$store.data.view"
											:result="$store.data.view !== 'reg' ? JSON.stringify($store.data.data?.tourDestinationHolidaySchedules) : []"
										></closing-day>
									</div>
								</div>
							</li>

							<li class="relative z-3">
								<div
									class="group grid max-w-375 grid-cols-[100px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
								>
									<ui-tit
										class="group-not-[[view=detail]]:pt-1 group-has-[[view=detail]]:place-content-center"
										tit="운영 시간"
									></ui-tit>

									<operating-hours
										rest="off"
										:view="$store.data.view"
										:result="tourDestinationOperatingSchedules"
									></operating-hours>
								</div>
							</li>

							<li>
								<div
									class="grid max-w-375 grid-cols-[100px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
								>
									<ui-tit
										tit="운영 안내"
										x-bind:req="$store.data.view !== 'detail'"
										x-bind:tip="$store.data.view !== 'detail' ? '30자 이내 권장' : ''"
										tooltip="언어에 따라 표현 길이가 달라질 수 <br />있으므로 번역 내용을 확인해주세요. (최대 60자)"
									></ui-tit>

									<lang-translate
										data-max-length="60"
										:view="$store.data.view"
										:lang="operationGuide ?? '{}'"
									></lang-translate>
								</div>
							</li>

							<li class="space-y-2">
								<div
									class="grid max-w-375 grid-cols-[200px_1fr] gap-5 px-4 pt-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
								>
									<ui-tit
										tit="홈페이지 링크"
										x-bind:req="$store.data.view !== 'detail'"
										:sub="$store.data.view !== 'detail'? '사용자에게 제공할 링크를 작성해 주세요' : ''"
									></ui-tit>

									<template x-if="$store.data.view === 'detail'">
										<ui-link
											icon-name="link"
											icon-pos="lt"
											icon-cls="size-3 stroke-black flex"
											:view="$store.data.view"
											:txt="$store.data.data?.homepageUrl ?? ''"
											:link="$store.data.data?.homepageUrl ?? ''"
										></ui-link>
									</template>
									<template x-if="$store.data.view !== 'detail'">
										<input-text
											data-type="url"
											placeholder="https://(또는 http://)를 포함하여 URL를 입력해주세요"
											:view="$store.data.view"
											:value="$store.data.data?.homepageUrl ?? ''"
										></input-text>
									</template>
								</div>

								<div
									class="grid max-w-375 grid-cols-[200px_1fr] gap-5 px-4 has-[[view=detail]]:grid-cols-[122px_1fr]"
								>
									<ui-tit tit="사용자 지도 링크" x-bind:req="$store.data.view !== 'detail'"></ui-tit>

									<template x-if="$store.data.view === 'detail'">
										<ui-link
											icon-name="link"
											icon-pos="lt"
											icon-cls="size-3 stroke-black flex"
											:view="$store.data.view"
											:txt="$store.data.data?.mapUrl ?? ''"
											:link="$store.data.data?.mapUrl ?? ''"
										></ui-link>
									</template>
									<template x-if="$store.data.view !== 'detail'">
										<input-text
											data-type="url"
											placeholder="https://(또는 http://)를 포함하여 URL를 입력해주세요"
											:view="$store.data.view"
											:value="$store.data.data?.mapUrl ?? ''"
										></input-text>
									</template>
								</div>
							</li>
						</ul>
					</section>

					<section class="shadow-1xs rounded-lg bg-white p-5" id="target-scroll-tab-section-1">
						<ui-tit tag="h2" size="lg" tit="커스텀 항목"></ui-tit>

						<group-custom :view="$store.data.view" :result="JSON.stringify($store.data.data) ?? '{}'"></group-custom>
					</section>
				</article>
			</main>
		</section>

		<alert-popup class="fixed top-0 left-0" txt="" confirm="확인" cancel="취소" open="close"></alert-popup>

		<script async type="module" src="/output/wc.es.js"></script>
		<script defer src="/output/store/layout-store.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

		<script defer>
			document.addEventListener('alpine:init', () => {
				if (Alpine.store('data')) return;

				Alpine.store('data', {
					items: [],
					data: {},
					item: null,
					pageId: '',
					loading: false,
					error: null,
					itemId: '',
					view: 'reg',

					setItemId(id = '') {
						this.itemId = id;
					},

					getItemId() {
						return this.itemId;
					},

					getRouteInfo() {
						const segments = window.location.pathname.split('/').filter(Boolean);
						return {
							resource: segments[0] ?? '',
							view: 'edit',
							id: '1',
						};
					},

					async fetchData(page = 1) {
						this.loading = true;
						this.error = null;

						try {
							
				const module = await import('../../../json/db.json', {
					with: { type: 'json' },
				});

				const data = module.default;
							const payload = data?.['tour-destinations']?.data ?? {};
							this.items = payload?.items ?? [];

							const { view, id } = this.getRouteInfo();
							this.view = view;

							if ((view === 'detail' || view === 'edit' || view === 'reg') && id) {
								this.setItemId(id);
								await this.findInit(id);
							}
						} catch (error) {
							this.error = error instanceof Error ? error.message : 'Unknown error';
							console.error('데이터 로드 실패:', error);
						} finally {
							this.loading = false;
						}
					},

					async init() {
						await this.fetchData(1);
					},

					async findInit(id = '') {
						if (!id) return;
						this.data = this.items.find((v) => v.id === Number(id)) ?? {};

						this.name = JSON.stringify(this.data.name) ?? '{}';

						document.querySelector('lang-translate').lang = this.data.name;
					},

					t(lang) {
						this.data.name = {
							ko: '',
							en: '',
							zh: '',
							ja: '',
							th: '',
							vi: '',
						};

						const el = document.querySelector('lang-translate');
						if (el) {
							el.lang = this.data.name;
						}
					},
				});
			});
		</script>
	</body>
</html>
