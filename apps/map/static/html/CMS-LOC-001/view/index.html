<!doctype html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ui</title>
		<link rel="stylesheet" href="/output/main-bundle.es.css" />
	</head>
	<body x-data>
		<section class="grid h-dvh grid-cols-[var(--lnb-width)_1fr] grid-rows-[var(--header-height)_1fr]">
			<aside-lnb class="row-span-2 h-full" authority="administrator"></aside-lnb>
			<!-- authority : D - user || administrator -->

			<header-list></header-list>

			<main class="main-container" id="main-container">
				<div class="grid w-full min-w-5xl">
					<section class="sticky top-0 z-5 w-full space-y-2 bg-slate-50 p-5 transition-all">
						<div class="flex items-center justify-between">
							<div>
								<template x-if="$store.list.view === 'reg'">
									<ui-tit tag="h2" size="lg" tit="대상지 등록"></ui-tit>
								</template>

								<template x-if="$store.list.view === 'edit'">
									<ui-tit tag="h2" size="lg" tit="대상지 수정"></ui-tit>
								</template>

								<template x-if="$store.list.view === 'detail'">
									<ui-tit tag="h2" size="lg" :tit="$store.list.item?.name?.ko?.value ?? ''"></ui-tit>
								</template>
							</div>

							<div class="itmes-center flex gap-3">
								<template x-if="$store.list.view === 'detail'">
									<div class="flex gap-3">
										<ui-btn class="w-20" variant="ghost" size="lg" txt="목록"></ui-btn>

										<ui-btn class="w-20" variant="ghost" size="lg" txt="삭제"></ui-btn>

										<ui-btn
											class="w-20"
											variant="primary"
											size="lg"
											txt="수정"
											@click.prevent="$store.list.setView('edit')"
										></ui-btn>
									</div>
								</template>

								<template x-if="$store.list.view === 'edit' || $store.list.view === 'reg'">
									<ui-btn class="w-20" variant="primary" size="lg" txt="저장"></ui-btn>
								</template>
							</div>
						</div>

						<template x-if="$store.list.view !== 'detail'">
							<div class="flex items-center">
								<ui-tit class="px-4.5" tit="섹션"></ui-tit>

								<div class="itmes-center flex gap-3">
									<ui-btn
										class="w-60 gap-3"
										tag="label"
										variant="segmented"
										size="lg"
										name="tab-section"
										:arr="JSON.stringify(['1. 대상지 정보', '2. 커스텀 항목'])"
										scroll="tab-section"
									></ui-btn>
								</div>
							</div>
						</template>
					</section>

					<article class="px-5 pb-5">
						<section class="shadow-1xs space-y-3 rounded-lg bg-white p-5" id="target-scroll-tab-section-0">
							<ui-tit tag="h3" size="lg" tit="대상지 정보"></ui-tit>

							<ul class="divide-y divide-slate-300">
								<li>
									<div
										class="grid max-w-375 grid-cols-[240px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
									>
										<template x-if="$store.list.view === 'detail'">
											<ui-tit tit="제공 언어"></ui-tit>
										</template>
										<template x-if="$store.list.view !== 'detail'">
											<ui-tit tit="제공 언어" sub="사용자에게 제공할 언어를 선택해 주세요"></ui-tit>
										</template>

										<template x-if="$store.list.view === 'reg'">
											<lang-chk class="flex flex-wrap items-center justify-end gap-5" view="reg"></lang-chk>
										</template>
										<template x-if="$store.list.view !== 'reg'">
											<lang-chk
												class="flex flex-wrap items-center justify-end gap-5"
												:view="$store.list.view"
												:lang="JSON.stringify($store.list.item?.language ?? {})"
											></lang-chk>
										</template>
									</div>
								</li>

								<li>
									<div
										class="grid max-w-375 grid-cols-[100px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
									>
										<template x-if="$store.list.view === 'detail'">
											<ui-tit tit="다국어 대상지명"></ui-tit>
										</template>
										<template x-if="$store.list.view !== 'detail'">
											<ui-tit
												tit="대상지명"
												tip="15자 이내 권장"
												tooltip="언어에 따라 표현 길이가 달라질 수 &lt;br /&gt;있으므로 번역 내용을 확인해주세요. (최대 50자)"
											></ui-tit>
										</template>

										<template x-if="$store.list.view === 'reg'">
											<lang-translate
												class="flex-1"
												data-max-length="50"
												:view="$store.list.view ?? {}"
											></lang-translate>
										</template>
										<template x-if="$store.list.view !== 'reg'">
											<lang-translate
												class="flex-1"
												data-max-length="50"
												:view="$store.list.view"
												:lang="JSON.stringify($store.list.item?.name ?? {})"
											></lang-translate>
										</template>
									</div>
								</li>

								<li>
									<div
										class="grid max-w-375 grid-cols-[100px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
									>
										<ui-tit tit="위치" cls="h-full items-center"></ui-tit>
										<div class="flex flex-wrap items-center gap-5">
											<ui-txt size="sm" txt="지도의 중심 좌표를 선택해 주세요"></ui-txt>
											<ui-btn class="min-w-30" variant="ghost" size="md" txt="지도에서 선택하기"></ui-btn>
											<ui-txt size="sm" txt="서울특별시 용산구 이태원로 29 (한강로1가)" cls="text-black"></ui-txt>
										</div>
									</div>
								</li>

								<li>
									<div
										class="grid max-w-375 grid-cols-[100px_1fr_100px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr_122px_1fr]"
									>
										<ui-tit tit="운영 기간" cls="pt-1"></ui-tit>

										<template x-if="$store.list.view === 'reg'">
											<operating-period :view="$store.list.view"></operating-period>
										</template>
										<template x-if="$store.list.view !== 'reg'">
											<operating-period
												:view="$store.list.view"
												:result="JSON.stringify($store.list.item?.period ?? {})"
											></operating-period>
										</template>

										<ui-tit tit="정기 휴무" cls="pt-1"></ui-tit>

										<template x-if="$store.list.view === 'reg'">
											<closing-day :view="$store.list.view"></closing-day>
										</template>
										<template x-if="$store.list.view !== 'reg'">
											<closing-day
												:view="$store.list.view"
												:result="JSON.stringify($store.list.item?.closingDay ?? {})"
											></closing-day>
										</template>
									</div>
								</li>

								<li>
									<div
										class="grid max-w-375 grid-cols-[100px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
									>
										<ui-tit tit="운영 시간"></ui-tit>

										<template x-if="$store.list.view !== 'reg'">
											<operating-hours
												rest="off"
												:view="$store.list.view"
												:result="JSON.stringify($store.list.item?.operatingHours ?? {})"
											></operating-hours>
										</template>
										<template x-if="$store.list.view === 'reg'">
											<operating-hours rest="off" :view="$store.list.view"></operating-hours>
										</template>
									</div>
								</li>

								<li>
									<div
										class="grid max-w-375 grid-cols-[100px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
									>
										<template x-if="$store.list.view === 'detail'">
											<ui-tit tit="운영 안내"></ui-tit>
										</template>
										<template x-if="$store.list.view !== 'detail'">
											<ui-tit
												tit="운영 안내"
												req
												tip="30자 이내 권장"
												tooltip="언어에 따라 표현 길이가 달라질 수 &lt;br /&gt;있으므로 번역 내용을 확인해주세요. (최대 60자)"
											></ui-tit>
										</template>

										<template x-if="$store.list.view !== 'reg'">
											<lang-translate
												data-max-length="50"
												:view="$store.list.view"
												:lang="JSON.stringify($store.list.item?.operationGuide ?? {})"
											></lang-translate>
										</template>
										<template x-if="$store.list.view === 'reg'">
											<lang-translate data-max-length="50" :view="$store.list.view"></lang-translate>
										</template>
									</div>
								</li>

								<li>
									<div
										class="grid max-w-375 grid-cols-[200px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
									>
										<template x-if="$store.list.view === 'detail'">
											<ui-tit tit="홈페이지 링크"></ui-tit>
										</template>
										<template x-if="$store.list.view !== 'detail'">
											<ui-tit tit="홈페이지 링크" req sub="사용자에게 제공할 링크를 작성해 주세요"></ui-tit>
										</template>

										<template x-if="$store.list.view === 'detail'">
											<ui-btn
												tag="a"
												variant="underline"
												size="md"
												cls="underline-offset-1 gap-4"
												icon-name="link"
												icon-pos="lt"
												icon-cls="size-3 stroke-black flex"
												:view="$store.list.view"
												:txt="$store.list.item?.linkHomepage ?? ''"
												:link="$store.list.item?.linkHomepage ?? ''"
											></ui-btn>
										</template>
										<template x-if="$store.list.view !== 'detail'">
											<input-text
												data-type="url"
												placeholder="https://(또는 http://)를 포함하여 URL를 입력해주세요"
												:view="$store.list.view"
												:value="$store.list.item?.linkHomepage ?? ''"
											></input-text>
										</template>
									</div>

									<div
										class="grid max-w-375 grid-cols-[200px_1fr] gap-5 px-4 py-5 has-[[view=detail]]:grid-cols-[122px_1fr]"
									>
										<template x-if="$store.list.view === 'detail'">
											<ui-tit tit="사용자 지도 링크"></ui-tit>
										</template>
										<template x-if="$store.list.view !== 'detail'">
											<ui-tit tit="사용자 지도 링크" req></ui-tit>
										</template>

										<template x-if="$store.list.view === 'detail'">
											<ui-btn
												tag="a"
												variant="underline"
												size="md"
												cls="underline-offset-1 gap-4"
												icon-name="link"
												icon-pos="lt"
												icon-cls="size-3 stroke-black flex"
												:view="$store.list.view"
												:txt="$store.list.item?.linkMap ?? ''"
												:link="$store.list.item?.linkMap ?? ''"
											></ui-btn>
										</template>
										<template x-if="$store.list.view !== 'detail'">
											<input-text
												data-type="url"
												placeholder="https://(또는 http://)를 포함하여 URL를 입력해주세요"
												:view="$store.list.view"
												:value="$store.list.item?.linkMap ?? ''"
											></input-text>
										</template>
									</div>
								</li>
							</ul>
						</section>

						<section class="shadow-1xs rounded-lg bg-white p-5" id="target-scroll-tab-section-1">
							<ui-tit tag="h2" size="lg" tit="커스텀 항목"></ui-tit>

							<group-custom :view="$store.list.view" :result="JSON.stringify($store.list.item?.custom ?? {})"></group-custom>
						</section>
					</article>
				</div>
			</main>
		</section>

		<alert-popup class="fixed top-0 left-0" txt="" confirm="확인" cancel="취소" open="close"></alert-popup>

		<script async type="module" src="/output/wc.es.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

		<script defer>
			document.addEventListener('alpine:init', () => {
				const listStore = Alpine.store('list');
				Alpine.store('list', {
					items: [],
					item: null,
					pageId: '',
					itemsToShow: 10,
					loading: false,
					error: null,
					itemId: '',
					getItemId() {
						return sessionStorage.getItem('cms-loc-page-view-id');
					},
					setItemId(id = '') {
						this.itemId = id;
						sessionStorage.setItem('cms-loc-page-view-id', id);
					},
					view: sessionStorage.getItem('cms-loc-page-view') ?? 'reg',
					setView(view) {
						this.view = view;
						sessionStorage.setItem('cms-loc-page-view', view);
					},
					async init() {
						this.loading = true;
						this.error = null;

						try {
							const res = await fetch('http://localhost:5185/CMS-LOC-001');

							if (!res.ok) {
								throw new Error('Failed to load json');
							}

							const data = await res.json();

							if (!data || data.length === 0) {
								throw new Error('Not found');
							}

							this.items = data;

							if (this.view === 'detail' || this.view === 'edit') {
								await this.findInit(this.getItemId());
							}
						} catch (error) {
							this.error = error.message ?? 'Unknown error';
							console.error('초기 데이터 설정 실패:', error);
						} finally {
							this.loading = false;
						}
					},
					findInit(id = '') {
						if (!id) return;

						const found = this.items.find((v) => v.id === String(id));

						if (!found) {
							this.error = '대상 데이터를 찾을 수 없습니다.';
							this.item = null;
							this.pageId = '';
							return;
						}

						this.item = found;
						this.pageId = found.id;
					},
				});
			});

			document.addEventListener('DOMContentLoaded', async () => {
				const listStore = Alpine.store('list');
				const pageId = 'CMS_01_1';

				try {
					if (listStore) {
						listStore.init();
					}
				} catch (error) {
					console.error('초기 데이터 설정 실패:', error);
				}
			});
		</script>
	</body>
</html>
