name: visit-servant-front-development

services:
  api:
    image: ${API_IMAGE:-visit-servant-front-api:develop-runtime}
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    env_file:
      - ${DOCKER_ENV_FILE:?DOCKER_ENV_FILE must point to the deployment env file}
    environment:
      NODE_ENV: development
      PORT: 3011
    ports:
      - '${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-3011}:3011'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3011/health/ready').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    networks:
      - app

  ui:
    image: ${UI_IMAGE:-visit-servant-front-ui:develop-runtime}
    build:
      context: ..
      dockerfile: Dockerfile.ui
    init: true
    restart: unless-stopped
    env_file:
      - ${DOCKER_ENV_FILE:?DOCKER_ENV_FILE must point to the deployment env file}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5195
      UI_API_V1_TARGET: http://api:3011
    ports:
      - '${UI_BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-5195}:5195'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:5195/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    networks:
      - app

networks:
  app:
    driver: bridge
